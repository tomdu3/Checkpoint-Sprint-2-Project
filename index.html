<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codewars leaderboard</title>
</head>

<body>
  <main>
    <h1>Codewars leaderboard</h1>
    <form id="leaderboard-form">
      <label for="usernames-input">Codewars usernames (comma-separated):</label>
      <input type="text" id="usernames-input" name="usernames"
        placeholder="e.g. CodeYourFuture, 40thieves, SallyMcGrath" aria-describedby="usernames-help" required />
      <button type="submit" id="submit-btn">Fetch Leaderboard</button>
    </form>
    <!-- display userData with aria-live for screen readers, and 
    display loading message while fetching-->
    <div id="user-data" aria-live="polite"></div>
  </main>
</body>

<script src="index.mjs" type="module"></script>

</html>
